<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Lost and Found · SRM Tiruchirappalli</title>
<style>
:root{
  --navy:#0c2757;--navy-2:#071a3d;--ink:#0f1a33;--muted:#566486;--paper:#eaf0fa;--card:#fff;--line:#d5deef;
  --lost:#f2552c;--found:#0eb09a;--sun:#ffc533;--focus:#2a6df4;
  --display:"Bahnschrift","Avenir Next Condensed","Franklin Gothic Medium","Arial Narrow Bold","Arial Black",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  font-family:var(--body);color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;line-height:1.5;background:var(--paper)}
body.present{zoom:1.15}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

/* header */
.top{background:var(--navy-2);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:3px 8px;display:flex}
.logo img{height:34px;display:block}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;text-decoration:none;letter-spacing:.01em}
.top-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 18px;border-radius:10px;text-decoration:none;border:2px solid transparent;cursor:pointer;font-weight:700;line-height:1.3;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-lost{background:var(--lost);color:#fff}
.btn-found{background:var(--found);color:#04302a}
.btn-sun{background:var(--sun);color:#3a2a00}
.btn-line{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn-line[aria-pressed=true]{background:#fff;color:var(--navy)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-danger{background:#fff;border-color:var(--lost);color:#b83a15}

/* hero */
.hero{background-color:var(--navy);color:#fff;overflow:hidden;
  background-image:radial-gradient(620px 320px at 88% 8%,rgba(14,176,154,.30),transparent 70%),
    radial-gradient(520px 320px at 6% 100%,rgba(242,85,44,.24),transparent 70%),
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:auto,auto,38px 38px,38px 38px}
.hero-in{max-width:1120px;margin:0 auto;padding:56px 22px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}
@media(max-width:880px){.hero-in{grid-template-columns:1fr;padding-top:36px}}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.7rem,6.4vw,5.2rem);line-height:.98;margin:0 0 18px;letter-spacing:-.01em}
.hero .sub{color:#b9c8ea;font-size:1.15rem;max-width:34rem;margin:0 0 26px}
.hsearch-wrap{display:flex;background:#fff;border-radius:14px;padding:6px;max-width:34rem;box-shadow:0 18px 40px -18px #000}
.hsearch-wrap:focus-within{outline:3px solid var(--sun)}
.hsearch{flex:1;min-width:0;border:0;padding:12px 14px;font-size:1.05rem;background:transparent;color:var(--ink)}
.hsearch:focus-visible{outline:none}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:34px}
.stat b{display:block;font-family:var(--display);font-size:2.6rem;line-height:1;font-weight:800}
.stat span{color:#b9c8ea;font-size:.92rem}

/* hanging tags in hero */
.tags{position:relative;height:400px}
@media(max-width:880px){.tags{height:330px;max-width:420px;margin:0 auto;width:100%}}
.htag{position:absolute;width:215px;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 26px 40px -22px #000;transform-origin:50% -34px;transform:rotate(var(--r))}
.htag::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:34px;background:rgba(255,255,255,.55)}
.htag.lost{--r:-6deg;left:0;top:34px;animation:swing 1.5s .15s both ease-out}
.htag.found{--r:5deg;right:0;top:96px;animation:swing 1.5s .4s both ease-out}
@media(max-width:880px){.htag{width:165px}.htag.found{top:70px}}
@keyframes swing{0%{transform:rotate(-20deg)}35%{transform:rotate(10deg)}65%{transform:rotate(-4deg)}100%{transform:rotate(var(--r))}}
.band{position:relative;height:44px;border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;font-weight:800;letter-spacing:.1em;font-size:.85rem}
.lost>.band,.tagcard.lost .band,.claim.lost .band{background:var(--lost)}
.found>.band,.tagcard.found .band,.claim.found .band{background:var(--found);color:#04302a}
.hole{position:absolute;left:50%;top:14px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--navy);box-shadow:inset 0 2px 3px rgba(0,0,0,.45)}
.htag .hole{background:var(--navy)}
.tagcard .hole,.claim .hole{background:var(--paper)}
.htag-body{padding:16px 16px 18px;text-align:left}
.htag-body .emoji{font-size:2.6rem;line-height:1}
.htag-body h3{margin:8px 0 2px;font-size:1.05rem}
.htag-body p{margin:0;color:var(--muted);font-size:.85rem}

/* toolbar */
.toolbar{padding:30px 0 12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.toolbar h2{font-family:var(--display);font-size:1.9rem;margin:0;font-weight:800}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 22px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:.92rem;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);font-weight:700}
.chip small{color:var(--muted);margin-left:6px}

/* tag cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:26px 22px;padding-bottom:50px}
.tagcard{position:relative;background:var(--card);border-radius:18px;text-decoration:none;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(12,39,87,.08),0 16px 30px -20px rgba(12,39,87,.55);transition:transform .2s,box-shadow .2s}
.tagcard:hover{transform:translateY(-7px) rotate(-.7deg);box-shadow:0 1px 0 rgba(12,39,87,.08),0 26px 36px -20px rgba(12,39,87,.6)}
.cover{aspect-ratio:4/3;background:#dfe7f6;display:grid;place-items:center;color:var(--muted);position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tc-body{padding:12px 16px 14px;flex:1}
.tc-body h3{margin:0 0 2px;font-size:1.08rem;line-height:1.25}
.tc-body p{margin:0;color:var(--muted);font-size:.9rem}
.stub{position:relative;border-top:2px dashed var(--line);padding:9px 16px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.stub::before,.stub::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
.stub::before{left:-8px}.stub::after{right:-8px}
.returned{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--sun);color:var(--sun);
  background:rgba(7,26,61,.55);font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.08em;padding:4px 16px;border-radius:8px}
.tagcard.back .cover img{filter:saturate(.35)}
.empty{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:44px 24px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty h3{margin:0 0 6px;color:var(--ink);font-family:var(--display);font-size:1.5rem}
.empty .btn{margin:6px 4px 0}

/* detail */
.back-link{display:inline-block;margin:26px 0 0;font-weight:600}
.detail{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding:18px 0 56px;align-items:start}
@media(max-width:820px){.detail{grid-template-columns:1fr}}
.gallery{display:grid;gap:14px}
.gallery img,.gallery video{width:100%;border-radius:16px;display:block;background:#000;box-shadow:0 16px 30px -22px rgba(12,39,87,.7)}
.gallery img{cursor:zoom-in;background:#fff}
.claim{position:relative;background:#fff;border-radius:18px;box-shadow:0 16px 30px -20px rgba(12,39,87,.55)}
.claim-body{padding:16px 22px 22px}
.claim h1{font-family:var(--display);font-size:2.2rem;line-height:1.05;margin:4px 0 6px;font-weight:800}
dl{margin:0}dt{font-weight:700;margin-top:14px;font-size:.88rem;color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.files{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.files a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--paper);border-radius:10px;text-decoration:none}
.files a:hover{outline:2px solid var(--navy)}
.claim-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:2px dashed var(--line)}
.done{background:#fff7da;border:1px solid #f0d77a;border-radius:10px;padding:10px 14px;margin-top:16px;font-weight:600}

/* form */
.formpage{display:grid;grid-template-columns:.62fr 1.38fr;gap:34px;padding:34px 0 56px;align-items:start}
@media(max-width:860px){.formpage{grid-template-columns:1fr}}
.formpage h1{font-family:var(--display);font-size:2.6rem;line-height:1;margin:0 0 10px;font-weight:800}
.tips{padding-left:18px;color:var(--muted)}
.tips li{margin-bottom:8px}
.panel{background:#fff;border-radius:18px;box-shadow:0 16px 30px -20px rgba(12,39,87,.55);overflow:hidden}
.panel .band{border-radius:0}
.panel-body{padding:22px}
.field{margin-bottom:16px}
label,.label{display:block;font-weight:700;margin-bottom:4px}
.hint{color:var(--muted);font-size:.88rem;font-weight:400}
input[type=text],input[type=email],select,textarea{width:100%;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.drop{border:2px dashed #8fa0c4;border-radius:14px;padding:22px;text-align:center;background:#f6f9ff}
.drop.over{border-color:var(--focus);background:#e8f0ff}
.drop .big{font-family:var(--display);font-size:1.3rem;font-weight:800}
.picked{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;text-align:left}
.picked li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.92rem}
.picked .pv{width:44px;height:44px;border-radius:8px;overflow:hidden;background:#dfe7f6;display:grid;place-items:center;font-size:.7rem;color:var(--muted);flex:none}
.picked .pv img,.picked .pv video{width:100%;height:100%;object-fit:cover}
.picked .name{flex:1;min-width:0;overflow-wrap:anywhere}
.picked .bad{color:#b83a15;font-weight:700}
.picked button{border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--muted);padding:0 6px}
.error{background:#fdecea;border:1px solid #f1b5ab;color:#7a2615;padding:12px 14px;border-radius:10px;margin-bottom:18px}

/* misc */
.site-foot{background:var(--navy-2);color:#9db0d8;font-size:.88rem;padding:24px 0 30px}
.site-foot .wrap{display:flex;gap:10px 30px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.site-foot button{background:none;border:0;color:#c9d6f3;text-decoration:underline;cursor:pointer;padding:0}
dialog{border:0;padding:0;background:transparent;max-width:94vw}
dialog::backdrop{background:rgba(7,26,61,.88)}
dialog img{max-width:94vw;max-height:88vh;display:block;border-radius:14px;cursor:zoom-out}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;z-index:50;font-weight:600;box-shadow:0 14px 30px -10px #000}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media(prefers-reduced-motion:reduce){.htag.lost,.htag.found{animation:none}.tagcard,.btn{transition:none}.tagcard:hover{transform:none}html{scroll-behavior:auto}}
</style>
</head>

<script>
(function () {
  'use strict';
  var CATS = ['Electronics', 'Documents', 'Books', 'Clothing', 'Accessories', 'Others'];
  var EXT = {
    image: ['png', 'jpg', 'jpeg', 'gif', 'webp'],
    video: ['mp4', 'webm', 'mov'],
    file: ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'csv']
  };
  var MAX_MB = { image: 8, video: 50, file: 10 };
  var MAX_FILES = 5;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var app = document.getElementById('app');
  var db = null, memory = [], urls = [], filterKind = '', filterCat = '', query = '', counted = false;

  /* ---------- helpers ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      var v = attrs[k];
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) { c.forEach(function (n) { if (n) el.appendChild(n); }); continue; }
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  function objUrl(blob) { var u = URL.createObjectURL(blob); urls.push(u); return u; }
  function clearUrls() { urls.forEach(function (u) { URL.revokeObjectURL(u); }); urls = []; }
  function sizeLabel(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function when(ms) { return new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function ago(ms) {
    var m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var hr = Math.round(m / 60);
    if (hr < 24) return hr + ' h ago';
    return Math.round(hr / 24) + ' d ago';
  }
  function toast(msg) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = h('div', { class: 'toast', role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function confetti() {
    if (reduced) return;
    var c = h('canvas', { class: 'confetti', 'aria-hidden': 'true' });
    c.width = innerWidth; c.height = innerHeight;
    document.body.appendChild(c);
    var x = c.getContext('2d'), cols = ['#f2552c', '#0eb09a', '#ffc533', '#2a6df4', '#ffffff'], ps = [];
    for (var i = 0; i < 150; i++) ps.push({
      x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight * .62,
      vx: (Math.random() - .5) * 16, vy: -(Math.random() * 15 + 6), s: Math.random() * 7 + 4,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length]
    });
    var t0 = performance.now();
    (function frame(t) {
      x.clearRect(0, 0, c.width, c.height);
      ps.forEach(function (p) {
        p.vy += .38; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); x.restore();
      });
      if (t - t0 < 2300) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  /* ---------- storage (IndexedDB, falls back to memory) ---------- */
  function openDB() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open('campus-lost-found', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('items', { keyPath: 'id' }); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function getAll() {
    if (!db) return Promise.resolve(memory.slice());
    return new Promise(function (res) {
      var q = db.transaction('items').objectStore('items').getAll();
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { res([]); };
    });
  }
  function save(item) {
    if (!db) { memory = memory.filter(function (i) { return i.id !== item.id; }); memory.push(item); return Promise.resolve(); }
    return new Promise(function (res, rej) {
      var t = db.transaction('items', 'readwrite');
      t.objectStore('items').put(item);
      t.oncomplete = function () { res(); };
      t.onerror = t.onabort = function () { rej(t.error || new Error('save failed')); };
    });
  }
  function remove(id) {
    if (!db) { memory = memory.filter(function (i) { return i.id !== id; }); return Promise.resolve(); }
    return new Promise(function (res) {
      var t = db.transaction('items', 'readwrite');
      t.objectStore('items').delete(id);
      t.oncomplete = function () { res(); }; t.onerror = function () { res(); };
    });
  }

  /* ---------- file validation ---------- */
  function extOf(name) { return name.indexOf('.') > -1 ? name.split('.').pop().toLowerCase() : ''; }
  function kindOf(name) {
    var e = extOf(name);
    for (var k in EXT) if (EXT[k].indexOf(e) > -1) return k;
    return null;
  }
  function problem(f) {
    var k = kindOf(f.name);
    if (!k) return 'File type not accepted';
    if (f.size === 0) return 'File is empty';
    if (f.size > MAX_MB[k] * 1048576) return 'Larger than ' + MAX_MB[k] + ' MB';
    return '';
  }
  function ascii(b, from, to) { return String.fromCharCode.apply(null, Array.prototype.slice.call(b, from, to)); }
  function signatureOk(ext, b) {
    if (ext === 'jpg' || ext === 'jpeg') return b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff;
    if (ext === 'png') return b[0] === 0x89 && ascii(b, 1, 4) === 'PNG';
    if (ext === 'gif') return ascii(b, 0, 3) === 'GIF';
    if (ext === 'webp') return ascii(b, 0, 4) === 'RIFF' && ascii(b, 8, 12) === 'WEBP';
    if (ext === 'mp4' || ext === 'mov') return ascii(b, 4, 8) === 'ftyp';
    if (ext === 'webm') return b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3;
    if (ext === 'pdf') return ascii(b, 0, 4) === '%PDF';
    if (ext === 'docx' || ext === 'xlsx' || ext === 'pptx') return b[0] === 0x50 && b[1] === 0x4b;
    if (ext === 'doc' || ext === 'xls' || ext === 'ppt') return b[0] === 0xd0 && b[1] === 0xcf && b[2] === 0x11 && b[3] === 0xe0;
    if (ext === 'txt' || ext === 'csv') return Array.prototype.indexOf.call(b, 0) === -1;
    return false;
  }
  function readHead(f) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(new Uint8Array(r.result)); };
      r.onerror = function () { rej(r.error); };
      r.readAsArrayBuffer(f.slice(0, 16));
    });
  }

  /* ---------- demo data (for presenting) ---------- */
  function demoImage(emoji, c1, c2) {

      var c = document.createElement('canvas'); c.width = 640; c.height = 480;
      var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 640, 480);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      x.fillStyle = g; x.fillRect(0, 0, 640, 480);
      x.fillStyle = 'rgba(255,255,255,.16)';
      x.beginPath(); x.arc(540, 80, 130, 0, 7); x.fill();
      x.beginPath(); x.arc(80, 440, 160, 0, 7); x.fill();
      x.font = '200px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(emoji, 320, 255);
      c.toBlob(function (b) { res(b); }, 'image/png');
    });
  }
  function seedDemo() {
    var HR = 3600000, now = Date.now();
    var rows = [
      ['lost', 'Student ID card', 'Documents', 'Blue lanyard, 2nd year CSE. Last seen near the library entrance.', 'Library, Block A', '\uD83D\uDCB3', '#2a6df4', '#0c2757', 2 * HR, false],

      ['lost', 'Casio scientific calculator', 'Electronics', 'Left after the internals exam. Initials scratched on the back.', 'Exam hall 3', '\uD83E\uDDEE', '#f2552c', '#7a1f0a', 20 * HR, false],
      ['found', 'Wireless earbuds in white case', 'Electronics', 'Found on a bench. Handed to the security desk.', 'Bus stop', '\uD83C\uDFA7', '#7a5af8', '#2b1a7a', 28 * HR, false],
      ['lost', 'Data Structures notebook', 'Books', 'Green cover with handwritten notes. Name on the first page.', 'Lab 2', '\uD83D\uDCD3', '#ffc533', '#9a6a00', 52 * HR, false],
      ['found', 'Red umbrella', 'Accessories', 'Folding umbrella with a black handle.', 'Main gate', '\u2602\uFE0F', '#e5484d', '#6d1218', 75 * HR, true]
    ];
    return Promise.all(rows.map(function (r, i) {
      return demoImage(r[5], r[6], r[7]).then(function (blob) {
        return save({
          id: 'demo' + i, demo: true, kind: r[0], name: r[1], category: r[2], description: r[3], location: r[4],
          reporterName: 'Demo Student', email: 'demo@example.edu', role: 'Student', reportedOn: now - r[8],
          returned: r[9], returnedOn: r[9] ? now - 60 * HR : 0,
          attachments: [{ name: 'photo.png', kind: 'image', size: blob.size, blob: blob }]
        });
      });
    }));
  }

  /* ---------- views ---------- */
  function tagCard(item) {
    var img = item.attachments.filter(function (a) { return a.kind === 'image'; })[0];
    var hasVideo = item.attachments.some(function (a) { return a.kind === 'video'; });
    var cover = h('div', { class: 'cover' },
      img ? h('img', { src: objUrl(img.blob), alt: item.name }) : (hasVideo ? 'Video attached' : 'No photo yet'),
      item.returned ? h('span', { class: 'returned', text: 'RETURNED' }) : null);
    return h('a', { class: 'tagcard ' + item.kind + (item.returned ? ' back' : ''), href: '#/item/' + item.id },
      h('div', { class: 'band' }, h('span', { text: item.kind.toUpperCase() }), h('span', { class: 'hole' }), h('span', { text: ago(item.reportedOn) })),
      cover,
      h('div', { class: 'tc-body' }, h('h3', { text: item.name }), h('p', { text: item.category + (item.location ? ' \u00b7 ' + item.location : '') })),
      h('div', { class: 'stub' }, h('span', { text: item.attachments.length ? item.attachments.length + (item.attachments.length === 1 ? ' file' : ' files') : 'No files' }), h('span', { text: 'Open' })));
  }

  function countUp(el, target) {
    if (reduced || counted || !target) { el.textContent = target; return; }
    var t0 = performance.now();
    (function step(t) {
      var p = Math.min(1, (t - t0) / 900);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function viewList() {
    var all = [];
    var grid = h('div');
    var chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Category' });
    var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Show' });
    var heading = h('h2');
    var sLost = h('b', { text: '0' }), sFound = h('b', { text: '0' }), sBack = h('b', { text: '0' });
    var search = h('input', { type: 'search', class: 'hsearch', value: query, 'aria-label': 'Search items',
      placeholder: 'Try \u201ccalculator\u201d, \u201cID card\u201d or \u201cbottle\u201d' });

    function visible() {
      var k = query.toLowerCase();
      return all.filter(function (i) {
        if (filterKind === 'returned' ? !i.returned : (filterKind && i.kind !== filterKind)) return false;
        if (filterCat && i.category !== filterCat) return false;
        return !k || [i.name, i.category, i.description].some(function (t) { return t.toLowerCase().indexOf(k) > -1; });
      }).sort(function (a, b) { return b.reportedOn - a.reportedOn; });
    }
    function drawChips() {
      chips.replaceChildren();
      [''].concat(CATS).forEach(function (c) {
        var n = c ? all.filter(function (i) { return i.category === c; }).length : all.length;
        chips.appendChild(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(filterCat === c),
          onclick: function () { filterCat = c; drawChips(); draw(); } }, c || 'All categories', h('small', { text: String(n) })));
      });
    }
    function drawSeg() {
      seg.replaceChildren();
      [['', 'All'], ['lost', 'Lost'], ['found', 'Found'], ['returned', 'Returned']].forEach(function (t) {
        seg.appendChild(h('button', { type: 'button', 'aria-pressed': String(filterKind === t[0]), text: t[1],
          onclick: function () { filterKind = t[0]; drawSeg(); draw(); } }));
      });
    }
    function draw() {
      clearUrls();
      var items = visible();
      heading.textContent = items.length + (items.length === 1 ? ' item' : ' items') + (query ? ' for \u201c' + query + '\u201d' : ' on the board');
      grid.replaceChildren();
      if (!items.length) {
        grid.className = 'grid';
        var box = h('div', { class: 'empty' });
        if (query) box.appendChild(h('h3', { text: 'No matching items found.' }));
        else {
          box.appendChild(h('h3', { text: 'The board is empty' }));
          box.appendChild(h('p', { text: 'Report the first item, or load a few sample items to see how it looks.' }));
          box.appendChild(h('button', { class: 'btn btn-sun', type: 'button', text: 'Load sample items',
            onclick: function () { seedDemo().then(refresh); } }));
        }
        grid.appendChild(box);
        return;
      }
      grid.className = 'grid';
      items.forEach(function (i) { grid.appendChild(tagCard(i)); });
    }
    function stats() {
      countUp(sLost, all.filter(function (i) { return i.kind === 'lost' && !i.returned; }).length);
      countUp(sFound, all.filter(function (i) { return i.kind === 'found' && !i.returned; }).length);
      countUp(sBack, all.filter(function (i) { return i.returned; }).length);
      counted = true;
    }
    function refresh() { getAll().then(function (items) { all = items; stats(); drawChips(); draw(); noteDemo(all); }); }
    search.addEventListener('input', function () { query = search.value.trim(); draw(); });

    function htag(kind, emoji, title, where) {
      return h('div', { class: 'htag ' + kind, 'aria-hidden': 'true' },
        h('div', { class: 'band' }, h('span', { text: kind.toUpperCase() }), h('span', { class: 'hole' }), h('span', { text: '' })),
        h('div', { class: 'htag-body' }, h('div', { class: 'emoji', text: emoji }), h('h3', { text: title }), h('p', { text: where })));
    }

    app.replaceChildren(
      h('section', { class: 'hero' }, h('div', { class: 'hero-in' },
        h('div', null,
          h('h1', { text: 'Lost it? Found it? Get it home.' }),
          h('p', { class: 'sub', text: 'One place on campus to report, search and return lost belongings. Add a photo or a short video so the owner knows it\u2019s theirs.' }),
          h('div', { class: 'hsearch-wrap' }, search),
          h('div', { class: 'hero-cta' },
            h('a', { class: 'btn btn-lost', href: '#/report/lost', text: 'I lost something' }),
            h('a', { class: 'btn btn-found', href: '#/report/found', text: 'I found something' })),
          h('div', { class: 'stats' },
            h('div', { class: 'stat' }, sLost, h('span', { text: 'still missing' })),
            h('div', { class: 'stat' }, sFound, h('span', { text: 'waiting for an owner' })),
            h('div', { class: 'stat' }, sBack, h('span', { text: 'back home' })))),
        h('div', { class: 'tags' },
          htag('lost', '\uD83D\uDCB3', 'Student ID card', 'Last seen: library, 9:40 AM'),
          htag('found', '\uD83D\uDCB3', 'Student ID card', 'Found: Block A desk, 10:15 AM')))),
      h('div', { class: 'wrap', id: 'board' },
        h('div', { class: 'toolbar' }, heading, seg), chips, grid));
    drawSeg();
    refresh();
  }

  function noteDemo(items) {
    var has = items.some(function (i) { return i.demo; });
    var note = document.getElementById('note');
    if (!db) { note.textContent = 'Storage is blocked in this browser, so reports last only until you refresh.'; return; }
    note.textContent = '';
    note.appendChild(document.createTextNode('Saved on this device only. '));
    if (has) note.appendChild(h('button', { type: 'button', text: 'Clear sample items', onclick: function () {
      getAll().then(function (all) { return Promise.all(all.filter(function (i) { return i.demo; }).map(function (i) { return remove(i.id); })); })
        .then(function () { toast('Sample items cleared'); route(); });
    } }));
  }

  function viewReport(kind) {
    var picked = [];
    var errBox = h('div', { class: 'error', role: 'alert', hidden: true });
    var list = h('ul', { class: 'picked', 'aria-live': 'polite' });
    var fileInput = h('input', { type: 'file', id: 'files', multiple: true,
      accept: 'image/*,video/mp4,video/webm,video/quicktime,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv' });
    var drop = h('div', { class: 'drop' }, h('div', { class: 'big', text: 'Drop photos, videos or documents here' }),
      h('p', { class: 'hint', text: 'or choose them from your device' }), fileInput, list);
    var submit = h('button', { class: 'btn ' + (kind === 'lost' ? 'btn-lost' : 'btn-found'), type: 'submit',
      text: kind === 'lost' ? 'Post lost item' : 'Post found item' });

    function showError(msg) { errBox.textContent = msg; errBox.hidden = !msg; if (msg) errBox.scrollIntoView({ block: 'nearest' }); }
    function renderPicked() {
      clearUrls();
      list.replaceChildren();
      var bad = picked.length > MAX_FILES;
      picked.forEach(function (f, idx) {
        var k = kindOf(f.name), msg = problem(f);
        if (msg) bad = true;
        var pv = h('div', { class: 'pv' }, k === 'image' && !msg ? h('img', { src: objUrl(f), alt: '' })
          : k === 'video' && !msg ? h('video', { src: objUrl(f), muted: true, preload: 'metadata' }) : (k ? 'doc' : '?'));
        list.appendChild(h('li', null, pv,
          h('span', { class: 'name', text: f.name + ' (' + sizeLabel(f.size) + ')' }),
          msg ? h('span', { class: 'bad', text: msg }) : null,
          h('button', { type: 'button', 'aria-label': 'Remove ' + f.name, text: '\u00d7',
            onclick: function () { picked.splice(idx, 1); renderPicked(); } })));
      });
      if (picked.length > MAX_FILES) list.appendChild(h('li', { class: 'bad', text: 'Choose at most ' + MAX_FILES + ' files.' }));
      submit.disabled = bad;
    }
    function addFiles(files) {
      Array.prototype.forEach.call(files, function (f) {
        if (!picked.some(function (p) { return p.name === f.name && p.size === f.size; })) picked.push(f);
      });
      fileInput.value = '';
      renderPicked();
    }
    fileInput.addEventListener('change', function () { addFiles(fileInput.files); });
    ['dragenter', 'dragover'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (ev) { if (ev.dataTransfer) addFiles(ev.dataTransfer.files); });

    function field(label, control, id) { return h('div', { class: 'field' }, h('label', { for: id, text: label }), control); }
    var name = h('input', { type: 'text', id: 'name', required: true });
    var cat = h('select', { id: 'category', required: true }, h('option', { value: '', text: 'Choose a category' }));
    CATS.forEach(function (c) { cat.appendChild(h('option', { value: c, text: c })); });
    var loc = h('input', { type: 'text', id: 'location', placeholder: 'Library, Block C, canteen' });
    var desc = h('textarea', { id: 'description', required: true });
    var rname = h('input', { type: 'text', id: 'rname', required: true });
    var email = h('input', { type: 'email', id: 'email', required: true });
    var role = h('select', { id: 'role' }, h('option', { text: 'Student' }), h('option', { text: 'Staff' }));

    var form = h('form', { class: 'panel' },
      h('div', { class: 'band' }, h('span', { text: kind.toUpperCase() + ' REPORT' }), h('span', { class: 'hole' }), h('span')),
      h('div', { class: 'panel-body' },
        errBox,
        field('Item name', name, 'name'),
        h('div', { class: 'two' }, field('Category', cat, 'category'),
          field(kind === 'lost' ? 'Last seen at (optional)' : 'Found at (optional)', loc, 'location')),
        field('Description', desc, 'description'),
        h('div', { class: 'field' },
          h('span', { class: 'label' }, 'Photos, videos and documents ', h('span', { class: 'hint', text: '(optional, up to ' + MAX_FILES + ' files)' })),
          drop,
          h('p', { class: 'hint', text: 'Images up to 8 MB (png, jpg, gif, webp). Videos up to 50 MB (mp4, webm, mov). Documents up to 10 MB (pdf, doc, docx, xls, xlsx, ppt, pptx, txt, csv).' })),
        h('div', { class: 'two' }, field('Your name', rname, 'rname'), field('College email', email, 'email')),
        field('I am a', role, 'role'),
        submit));
    form.classList.add(kind);

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      showError('');
      submit.disabled = true;
      var checks = picked.map(function (f) {
        return readHead(f).then(function (b) {
          if (!signatureOk(extOf(f.name), b)) throw new Error('\u201c' + f.name + '\u201d does not look like a real .' + extOf(f.name) + ' file.');
        });
      });
      Promise.all(checks).then(function () {
        var item = {
          id: Math.random().toString(16).slice(2, 10), kind: kind, name: name.value.trim(), category: cat.value,
          description: desc.value.trim(), location: loc.value.trim(), reporterName: rname.value.trim(),
          email: email.value.trim(), role: role.value, reportedOn: Date.now(), returned: false,
          attachments: picked.map(function (f) { return { name: f.name, kind: kindOf(f.name), size: f.size, blob: f.slice(0, f.size, f.type) }; })
        };
        return save(item).then(function () { toast('Report posted'); location.hash = '#/item/' + item.id; });
      }).catch(function (e) {
        showError(e && e.name === 'QuotaExceededError' ? 'This browser has no more room for files. Try fewer or smaller files.' : ((e && e.message) || 'Could not save the report.'));
        submit.disabled = false;
      });
    });

    app.replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'formpage' },
      h('div', null,
        h('h1', { text: kind === 'lost' ? 'Report a lost item' : 'Report a found item' }),
        h('p', { class: 'lead', style: 'color:var(--muted)', text: kind === 'lost' ? 'The more detail you add, the faster it gets home.' : 'Thank you for handing it in. Help the owner recognise it.' }),
        h('ul', { class: 'tips' },
          h('li', { text: 'Photograph the item on a plain surface in good light.' }),
          h('li', { text: 'Show marks, stickers or scratches that only the owner would know.' }),
          h('li', { text: 'Keep ID numbers and phone numbers out of the description.' }),
          h('li', { text: 'A 10 second video can show how a bag or device looks inside.' }))),
      form)));
    renderPicked();
  }

  function viewItem(id) {
    getAll().then(function (items) {
      var item = items.filter(function (i) { return i.id === id; })[0];
      if (!item) {
        app.replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'empty', style: 'margin-top:30px', text: 'This item was not found.' }),
          h('a', { class: 'back-link', href: '#/', text: '\u2190 Back to the board' })));
        return;
      }
      var lb = document.getElementById('lightbox'), lbImg = document.getElementById('lightbox-img');
      lb.onclick = function () { lb.close(); };
      var media = h('section', { class: 'gallery', 'aria-label': 'Photos and videos' });
      item.attachments.forEach(function (a, i) {
        if (a.kind === 'image') {
          var im = h('img', { src: objUrl(a.blob), alt: item.name + ' photo ' + (i + 1), title: 'Click to enlarge' });
          im.addEventListener('click', function () { lbImg.src = im.src; lbImg.alt = im.alt; lb.showModal(); });
          media.appendChild(im);
        }
        if (a.kind === 'video') media.appendChild(h('video', { controls: true, preload: 'metadata', src: objUrl(a.blob) }));
      });
      if (!media.children.length) media.appendChild(h('div', { class: 'empty', text: 'No photo or video was added to this report.' }));
      var docs = item.attachments.filter(function (a) { return a.kind === 'file'; });
      var dl = h('dl', null,
        h('dt', { text: 'Category' }), h('dd', { text: item.category }),
        item.location ? h('dt', { text: 'Where' }) : null, item.location ? h('dd', { text: item.location }) : null,
        h('dt', { text: 'Reported' }), h('dd', { text: when(item.reportedOn) }),
        h('dt', { text: 'Description' }), h('dd', { text: item.description }),
        h('dt', { text: 'Contact' }),
        h('dd', null, item.reporterName + ' (' + item.role + ')', h('br'), h('a', { href: 'mailto:' + item.email, text: item.email })));

      function setReturned(v) {
        item.returned = v; item.returnedOn = v ? Date.now() : 0;
        save(item).then(function () { if (v) { confetti(); toast('Marked as returned. Nice work!'); } else toast('Moved back to active'); viewItem(id); });
      }
      var actions = h('div', { class: 'claim-actions' },
        item.returned
          ? h('button', { class: 'btn btn-ghost', type: 'button', text: 'Undo return', onclick: function () { setReturned(false); } })
          : h('button', { class: 'btn btn-sun', type: 'button', text: 'Mark as returned', onclick: function () { setReturned(true); } }),
        h('button', { class: 'btn btn-danger', type: 'button', text: 'Delete report',
          onclick: function () { if (confirm('Delete this report and its files?')) remove(item.id).then(function () { location.hash = '#/'; }); } }));

      var side = h('aside', { class: 'claim ' + item.kind },
        h('div', { class: 'band' }, h('span', { text: item.kind.toUpperCase() }), h('span', { class: 'hole' }), h('span', { text: ago(item.reportedOn) })),
        h('div', { class: 'claim-body' },
          h('h1', { text: item.name }),
          item.returned ? h('div', { class: 'done', text: 'Returned on ' + when(item.returnedOn) }) : null,
          dl,
          docs.length ? h('div', null, h('div', { class: 'label', style: 'margin-top:18px', text: 'Documents' }),
            h('ul', { class: 'files' }, docs.map(function (a) {
              return h('li', null, h('a', { href: objUrl(a.blob), download: a.name }, h('span', { text: a.name }), h('span', { text: sizeLabel(a.size) })));
            }))) : null,
          actions));
      app.replaceChildren(h('div', { class: 'wrap' },
        h('a', { class: 'back-link', href: '#/', text: '\u2190 Back to the board' }),
        h('div', { class: 'detail' }, media, side)));
    });
  }

  /* ---------- router ---------- */
  function route() {
    clearUrls();
    var parts = (location.hash || '#/').slice(2).split('/');
    window.scrollTo(0, 0);
    if (parts[0] === 'report' && (parts[1] === 'lost' || parts[1] === 'found')) viewReport(parts[1]);
    else if (parts[0] === 'item' && parts[1]) viewItem(parts[1]);
    else viewList();
    if (parts[0] === 'report' || parts[0] === 'item') getAll().then(noteDemo);
  }
  window.addEventListener('hashchange', route);

  /* ---------- present mode ---------- */
  var presentBtn = document.getElementById('present');
  function setPresent(on) {
    document.body.classList.toggle('present', on);
    presentBtn.setAttribute('aria-pressed', String(on));
    presentBtn.textContent = on ? 'Exit presenting' : 'Present';
  }
  presentBtn.addEventListener('click', function () {
    var on = !document.body.classList.contains('present');
    setPresent(on);
    try {
      if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      if (!on && document.fullscreenElement) document.exitFullscreen();
    } catch (e) { /* fullscreen is optional */ }
  });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement) setPresent(false); });

  openDB().then(function (d) { db = d; route(); });
})();
</script>
</body>
</html>
